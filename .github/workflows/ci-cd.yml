name: Flask CI/CD

on:
  push:
    branches: [main, staging]
    tags: ['v*']

jobs:
  test:
    name: Install dependencies and run tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db
      SECRET_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package application
        run: zip -r app.zip . -x ".git/*" ".github/*" "venv/*"
      - uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-package
      - name: Deploy to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "STAGING_DEPLOY_KEY is missing"; exit 1; fi
          echo "Using staging deploy key (value hidden)"
          unzip -q app.zip -d staging_release
          echo "Deploying to STAGING environment..."
          ls staging_release
          echo "Staging deployment complete."

  deploy-production:
    name: Deploy to Production
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-package
      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "PRODUCTION_DEPLOY_KEY is missing"; exit 1; fi
          echo "Using production deploy key (value hidden)"
          unzip -q app.zip -d production_release
          echo "Deploying release ${{ github.ref_name }} to PRODUCTION environment..."
          ls production_release
          echo "Production deployment complete."